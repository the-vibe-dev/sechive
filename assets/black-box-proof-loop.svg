<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">SecHive.ai black-box proof loop</title>
  <desc id="desc">A proof-first black-box assessment workflow from scope to observation, hypothesis, validation, evidence, report, and reviewer handoff.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbf8f0"/>
      <stop offset="1" stop-color="#f0e9d7"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" x2="1">
      <stop offset="0" stop-color="#0e1a36"/>
      <stop offset="1" stop-color="#1a2a4e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0e1a36" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1400" height="620" fill="url(#paper)"/>
  <path d="M0 76h1400M0 228h1400M0 380h1400M0 532h1400M122 0v620M350 0v620M578 0v620M806 0v620M1034 0v620M1262 0v620" stroke="#d8cfb8" stroke-width="1" opacity=".55"/>
  <rect x="58" y="58" width="1284" height="504" rx="18" fill="#fbf8f0" stroke="#0e1a36" stroke-width="2" filter="url(#shadow)"/>
  <text x="92" y="116" font-family="Sora, Arial, sans-serif" font-size="44" font-weight="800" fill="#0e1a36">SecHive.ai Black-Box Proof Loop</text>
  <text x="94" y="156" font-family="JetBrains Mono, monospace" font-size="15" letter-spacing="3" fill="#8e6610">NO SOURCE · NO ANSWER KEY · OBSERVE → TEST → PROVE</text>
  <g font-family="Manrope, Arial, sans-serif">
    <g transform="translate(88 230)">
      <rect width="165" height="150" rx="12" fill="url(#navy)"/>
      <text x="22" y="42" font-size="20" font-weight="800" fill="#f6f1e6">1. Scope</text>
      <text x="22" y="78" font-size="15" fill="#dce0eb">Target, ROE, limits,</text>
      <text x="22" y="101" font-size="15" fill="#dce0eb">stop conditions,</text>
      <text x="22" y="124" font-size="15" fill="#dce0eb">allowed intensity.</text>
    </g>
    <g transform="translate(278 230)">
      <rect width="165" height="150" rx="12" fill="#fff" stroke="#0e1a36" stroke-width="2"/>
      <text x="22" y="42" font-size="20" font-weight="800" fill="#0e1a36">2. Observe</text>
      <text x="22" y="78" font-size="15" fill="#4a5878">Browser traffic,</text>
      <text x="22" y="101" font-size="15" fill="#4a5878">routes, APIs, auth,</text>
      <text x="22" y="124" font-size="15" fill="#4a5878">errors, objects.</text>
    </g>
    <g transform="translate(468 230)">
      <rect width="165" height="150" rx="12" fill="#fff" stroke="#0e1a36" stroke-width="2"/>
      <text x="22" y="42" font-size="20" font-weight="800" fill="#0e1a36">3. Hypothesize</text>
      <text x="22" y="78" font-size="15" fill="#4a5878">Candidate paths,</text>
      <text x="22" y="101" font-size="15" fill="#4a5878">negative tests,</text>
      <text x="22" y="124" font-size="15" fill="#4a5878">attack graph.</text>
    </g>
    <g transform="translate(658 230)">
      <rect width="165" height="150" rx="12" fill="#fff" stroke="#0e1a36" stroke-width="2"/>
      <text x="22" y="42" font-size="20" font-weight="800" fill="#0e1a36">4. Validate</text>
      <text x="22" y="78" font-size="15" fill="#4a5878">Benign replay,</text>
      <text x="22" y="101" font-size="15" fill="#4a5878">controlled proof,</text>
      <text x="22" y="124" font-size="15" fill="#4a5878">scope guarded.</text>
    </g>
    <g transform="translate(848 230)">
      <rect width="165" height="150" rx="12" fill="#fff" stroke="#0e1a36" stroke-width="2"/>
      <text x="22" y="42" font-size="20" font-weight="800" fill="#0e1a36">5. Preserve</text>
      <text x="22" y="78" font-size="15" fill="#4a5878">Request, response,</text>
      <text x="22" y="101" font-size="15" fill="#4a5878">hashes, screenshots,</text>
      <text x="22" y="124" font-size="15" fill="#4a5878">redaction notes.</text>
    </g>
    <g transform="translate(1038 230)">
      <rect width="165" height="150" rx="12" fill="#fff" stroke="#0e1a36" stroke-width="2"/>
      <text x="22" y="42" font-size="20" font-weight="800" fill="#0e1a36">6. Report</text>
      <text x="22" y="78" font-size="15" fill="#4a5878">CVSS, harm, fixes,</text>
      <text x="22" y="101" font-size="15" fill="#4a5878">proof pack links,</text>
      <text x="22" y="124" font-size="15" fill="#4a5878">reviewer-ready.</text>
    </g>
    <g transform="translate(1228 230)">
      <rect width="88" height="150" rx="12" fill="#e2a52a" stroke="#0e1a36" stroke-width="2"/>
      <text x="22" y="52" font-size="20" font-weight="800" fill="#0e1a36">Ship</text>
      <text x="22" y="91" font-size="15" fill="#0e1a36">or</text>
      <text x="22" y="116" font-size="15" fill="#0e1a36">refute</text>
    </g>
  </g>
  <g fill="none" stroke="#e2a52a" stroke-width="5" stroke-linecap="round">
    <path d="M253 305h25"/>
    <path d="M443 305h25"/>
    <path d="M633 305h25"/>
    <path d="M823 305h25"/>
    <path d="M1013 305h25"/>
    <path d="M1203 305h25"/>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="13" fill="#4a5878">
    <text x="92" y="456">A finding is not counted because the model said it exists.</text>
    <text x="92" y="484">A finding is counted when a scoped target interaction produces reviewer-defensible proof.</text>
    <text x="92" y="512">If source, known solutions, or operator-provided hints are used, SecHive labels that run separately.</text>
  </g>
</svg>
