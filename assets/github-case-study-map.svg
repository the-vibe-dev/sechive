<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">SecHive.ai case study map</title>
  <desc id="desc">A market-facing map of SecHive.ai case study tracks for black-box benchmarks, bug bounty proof patterns, customer reporting, and training evidence.</desc>
  <rect width="1400" height="520" fill="#f6f1e6"/>
  <path d="M70 70h1260v380H70z" fill="#fbf8f0" stroke="#0e1a36" stroke-width="2"/>
  <text x="104" y="132" font-family="Sora, Arial, sans-serif" font-size="48" font-weight="800" fill="#0e1a36">SecHive.ai Case Studies</text>
  <text x="106" y="170" font-family="JetBrains Mono, monospace" font-size="15" letter-spacing="3" fill="#8e6610">REAL RUNS · SANITIZED EVIDENCE · REVIEWABLE PROOF</text>
  <g font-family="Manrope, Arial, sans-serif">
    <g transform="translate(112 238)">
      <rect width="260" height="130" rx="10" fill="#0e1a36"/>
      <text x="24" y="42" font-size="22" font-weight="800" fill="#f6f1e6">Black-box benchmarks</text>
      <text x="24" y="78" font-size="15" fill="#dce0eb">No source. No answer key.</text>
      <text x="24" y="102" font-size="15" fill="#dce0eb">Evidence from runtime only.</text>
    </g>
    <g transform="translate(405 238)">
      <rect width="260" height="130" rx="10" fill="#fff" stroke="#0e1a36" stroke-width="2"/>
      <text x="24" y="42" font-size="22" font-weight="800" fill="#0e1a36">Bug bounty patterns</text>
      <text x="24" y="78" font-size="15" fill="#4a5878">Root-cause families,</text>
      <text x="24" y="102" font-size="15" fill="#4a5878">not private disclosures.</text>
    </g>
    <g transform="translate(698 238)">
      <rect width="260" height="130" rx="10" fill="#fff" stroke="#0e1a36" stroke-width="2"/>
      <text x="24" y="42" font-size="22" font-weight="800" fill="#0e1a36">Customer reports</text>
      <text x="24" y="78" font-size="15" fill="#4a5878">CVSS, harm, evidence,</text>
      <text x="24" y="102" font-size="15" fill="#4a5878">and remediation.</text>
    </g>
    <g transform="translate(991 238)">
      <rect width="260" height="130" rx="10" fill="#e2a52a" stroke="#0e1a36" stroke-width="2"/>
      <text x="24" y="42" font-size="22" font-weight="800" fill="#0e1a36">Training evidence</text>
      <text x="24" y="78" font-size="15" fill="#0e1a36">Flags removed.</text>
      <text x="24" y="102" font-size="15" fill="#0e1a36">Capability retained.</text>
    </g>
  </g>
  <text x="106" y="430" font-family="JetBrains Mono, monospace" font-size="14" fill="#4a5878">This repository is Markdown-first so reviewers can read the story directly in GitHub.</text>
</svg>
