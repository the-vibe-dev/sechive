<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">SecHive.ai XBOW-style benchmark campaign scorecard</title>
  <desc id="desc">Public-safe benchmark scorecard showing SecHive.ai practical any-win, black-box, white-box, and full-pair performance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.58" stop-color="#14324f"/>
      <stop offset="1" stop-color="#fff7e8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#f8fbff" stop-opacity="0.94"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#07111f" flood-opacity="0.26"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="1010" cy="86" r="164" fill="#16a36f" opacity="0.14"/>
  <circle cx="188" cy="462" r="210" fill="#2563eb" opacity="0.14"/>
  <path d="M64 142 C260 74 382 212 566 146 C742 83 872 108 1120 44" fill="none" stroke="#c9f3e6" stroke-width="2" opacity="0.32"/>
  <text x="72" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b7c7da" letter-spacing="2">PUBLIC-SAFE BENCHMARK CASE STUDY</text>
  <text x="72" y="132" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="800" fill="#ffffff">SecHive.ai on XBOW-style web targets</text>
  <text x="72" y="173" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#d7e3f1">Proof-first autonomous runs across black-box and source-enabled workflows.</text>
  <rect x="812" y="78" width="316" height="82" rx="22" fill="#ffffff" opacity="0.93"/>
  <text x="838" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#64748b">White-box best-of</text>
  <text x="838" y="146" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="900" fill="#16a36f">104 / 104 wins</text>

  <g filter="url(#shadow)">
    <rect x="72" y="228" width="244" height="192" rx="24" fill="url(#card)"/>
    <text x="98" y="276" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#64748b">Practical any-win</text>
    <text x="98" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="900" fill="#16a36f">100%</text>
    <text x="100" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#334155">104 / 104 recorded cases</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="346" y="228" width="244" height="192" rx="24" fill="url(#card)"/>
    <text x="372" y="276" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#64748b">Black-box wins</text>
    <text x="372" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="900" fill="#2563eb">95.19%</text>
    <text x="374" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#334155">99 / 104 best-of</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="228" width="244" height="192" rx="24" fill="url(#card)"/>
    <text x="646" y="276" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#64748b">White-box wins</text>
    <text x="646" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="900" fill="#16a36f">100%</text>
    <text x="648" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#334155">104 / 104 best-of</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="894" y="228" width="234" height="192" rx="24" fill="url(#card)"/>
    <text x="920" y="276" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#64748b">Full paired wins</text>
    <text x="920" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="900" fill="#172033">95.19%</text>
    <text x="922" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#334155">Both modes succeeded</text>
  </g>

  <text x="72" y="475" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#d7e3f1">Methodology note: internal recorded campaign, public-safe aggregate reporting, no benchmark solution paths included.</text>
  <text x="72" y="498" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#d7e3f1">White-box and black-box are reported separately; public comparisons vary by mode and scoring rule.</text>
</svg>
