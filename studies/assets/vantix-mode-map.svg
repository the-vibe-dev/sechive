<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">Vantix mode map</title>
  <desc id="desc">Vantix mode-specific workflows and output types.</desc>
  <rect width="1400" height="460" rx="30" fill="#f8fafc"/>
  <text x="70" y="60" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" fill="#172033" font-weight="900">One engine, mode-specific workflows</text>
  <text x="70" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#64748b">Pentest, Bug Bounty, Own Source, Android/APK, Reverse Engineering, and PR Audit share proof semantics but produce different deliverables.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(70 140)"><rect width="200" height="220" rx="22" fill="#eff6ff" stroke="#bfdbfe"/><text x="24" y="42" font-size="19" fill="#1e40af" font-weight="900">Pentest</text><text x="24" y="82" font-size="14" fill="#475569">Rules of engagement</text><text x="24" y="110" font-size="14" fill="#475569">Validation gates</text><text x="24" y="138" font-size="14" fill="#475569">Security report</text><text x="24" y="166" font-size="14" fill="#475569">Evidence + custody</text></g>
    <g transform="translate(290 140)"><rect width="200" height="220" rx="22" fill="#ecfdf5" stroke="#bbf7d0"/><text x="24" y="42" font-size="19" fill="#166534" font-weight="900">Bug Bounty</text><text x="24" y="82" font-size="14" fill="#475569">Program scope</text><text x="24" y="110" font-size="14" fill="#475569">Scope evidence</text><text x="24" y="138" font-size="14" fill="#475569">Submission report</text><text x="24" y="166" font-size="14" fill="#475569">Sanitized pack</text></g>
    <g transform="translate(510 140)"><rect width="200" height="220" rx="22" fill="#faf5ff" stroke="#e9d5ff"/><text x="24" y="42" font-size="19" fill="#6b21a8" font-weight="900">Own Source</text><text x="24" y="82" font-size="14" fill="#475569">Uploaded repo</text><text x="24" y="110" font-size="14" fill="#475569">Source-first hypotheses</text><text x="24" y="138" font-size="14" fill="#475569">Affected files</text><text x="24" y="166" font-size="14" fill="#475569">Fix/test guidance</text></g>
    <g transform="translate(730 140)"><rect width="200" height="220" rx="22" fill="#fff7ed" stroke="#fed7aa"/><text x="24" y="42" font-size="19" fill="#9a3412" font-weight="900">Android/APK</text><text x="24" y="82" font-size="14" fill="#475569">Low-noise device</text><text x="24" y="110" font-size="14" fill="#475569">APK metadata</text><text x="24" y="138" font-size="14" fill="#475569">Components</text><text x="24" y="166" font-size="14" fill="#475569">Mobile proof</text></g>
    <g transform="translate(950 140)"><rect width="200" height="220" rx="22" fill="#fef2f2" stroke="#fecaca"/><text x="24" y="42" font-size="19" fill="#991b1b" font-weight="900">Reverse Eng.</text><text x="24" y="82" font-size="14" fill="#475569">Decompile workspace</text><text x="24" y="110" font-size="14" fill="#475569">Native / firmware</text><text x="24" y="138" font-size="14" fill="#475569">Trust boundaries</text><text x="24" y="166" font-size="14" fill="#475569">Validation leads</text></g>
    <g transform="translate(1170 140)"><rect width="200" height="220" rx="22" fill="#f1f5f9" stroke="#cbd5e1"/><text x="24" y="42" font-size="19" fill="#334155" font-weight="900">PR Audit</text><text x="24" y="82" font-size="14" fill="#475569">Diff-only</text><text x="24" y="110" font-size="14" fill="#475569">CI severity gate</text><text x="24" y="138" font-size="14" fill="#475569">Stable comment</text><text x="24" y="166" font-size="14" fill="#475569">Proof links</text></g>
  </g>
  <text x="70" y="414" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#64748b">Shared engine: mode contract → scope gate → recon/source/mobile signals → skill routing → HypothesisGraph → validation → proof/report pack.</text>
</svg>
