<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">SecHive.ai proof-first autonomous security workbench</title>
  <desc id="desc">A polished SecHive.ai header showing scope, skills, proof, replay, and signed reports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="48%" stop-color="#0c2338"/>
      <stop offset="100%" stop-color="#0f3f3a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15263b"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1400" height="360" rx="34" fill="url(#bg)"/>
  <circle cx="1130" cy="42" r="220" fill="#16a36f" opacity="0.12"/>
  <circle cx="1160" cy="280" r="200" fill="#2563eb" opacity="0.13"/>
  <path d="M0 280 C210 220, 330 340, 520 284 S840 180, 1060 236 1240 330, 1400 220 L1400 360 L0 360 Z" fill="#22c55e" opacity="0.08"/>
  <g transform="translate(74 70)">
    <rect width="108" height="108" rx="28" fill="#ffffff" opacity="0.96"/>
    <path d="M31 31 L54 84 L77 31" fill="none" stroke="#2563eb" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M82 78 L99 96" stroke="#16a36f" stroke-width="9" stroke-linecap="round"/>
    <text x="132" y="46" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#93e3c0" font-weight="800" letter-spacing="4">SECHIVE.AI</text>
    <text x="132" y="95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" fill="#ffffff" font-weight="900" letter-spacing="-2">Proof-first security automation</text>
    <text x="134" y="136" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" fill="#cbd5e1">Pentest · Bug Bounty · Own Source · Android/APK · Reverse Engineering · PR Audit</text>
  </g>
  <g filter="url(#shadow)" transform="translate(118 230)">
    <rect width="220" height="74" rx="18" fill="url(#card)" stroke="#1f8f6e"/>
    <text x="22" y="31" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#93e3c0" font-weight="800">1. Scope Gate</text>
    <text x="22" y="54" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#cbd5e1">authorization first</text>
  </g>
  <g filter="url(#shadow)" transform="translate(382 230)">
    <rect width="220" height="74" rx="18" fill="url(#card)" stroke="#3b82f6"/>
    <text x="22" y="31" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#bfdbfe" font-weight="800">2. Skill Match</text>
    <text x="22" y="54" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#cbd5e1">specialists from recon</text>
  </g>
  <g filter="url(#shadow)" transform="translate(646 230)">
    <rect width="220" height="74" rx="18" fill="url(#card)" stroke="#a78bfa"/>
    <text x="22" y="31" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#ddd6fe" font-weight="800">3. Hypotheses</text>
    <text x="22" y="54" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#cbd5e1">score, branch, refute</text>
  </g>
  <g filter="url(#shadow)" transform="translate(910 230)">
    <rect width="220" height="74" rx="18" fill="url(#card)" stroke="#f59e0b"/>
    <text x="22" y="31" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#fde68a" font-weight="800">4. Proof Packs</text>
    <text x="22" y="54" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#cbd5e1">replay + hashes</text>
  </g>
  <g filter="url(#shadow)" transform="translate(1158 230)">
    <rect width="220" height="74" rx="18" fill="url(#card)" stroke="#22c55e"/>
    <text x="22" y="31" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#bbf7d0" font-weight="800">5. Signed Reports</text>
    <text x="22" y="54" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#cbd5e1">mode-aware outputs</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" opacity="0.65">
    <path d="M338 267 L382 267"/>
    <path d="M602 267 L646 267"/>
    <path d="M866 267 L910 267"/>
    <path d="M1130 267 L1158 267"/>
  </g>
</svg>
