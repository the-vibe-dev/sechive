<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Recon-to-skill routing</title>
  <desc id="desc">Recon features score and select specialist skills for Vantix security analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#123b35"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.30"/></filter>
  </defs>
  <rect width="1400" height="420" rx="30" fill="url(#bg)"/>
  <text x="72" y="58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" fill="#ffffff" font-weight="900">Recon-to-Skill Router</text>
  <text x="72" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#cbd5e1">Evidence decides which specialists run next — not a generic prompt.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect x="72" y="132" width="280" height="248" rx="22" fill="#ffffff"/>
    <text x="100" y="168" font-size="19" fill="#172033" font-weight="900">Features</text>
    <text x="100" y="206" font-size="15" fill="#475569">• Routes and APIs</text>
    <text x="100" y="232" font-size="15" fill="#475569">• Source and dependencies</text>
    <text x="100" y="258" font-size="15" fill="#475569">• APK metadata</text>
    <text x="100" y="284" font-size="15" fill="#475569">• Browser evidence</text>
    <text x="100" y="310" font-size="15" fill="#475569">• Cloud / CI / credentials</text>
    <text x="100" y="336" font-size="15" fill="#475569">• KnowledgeGraph recall</text>
    <rect x="442" y="132" width="340" height="248" rx="22" fill="#ffffff"/>
    <text x="470" y="168" font-size="19" fill="#172033" font-weight="900">Scoring</text>
    <text x="470" y="206" font-size="15" fill="#475569">surface match × evidence strength</text>
    <text x="470" y="232" font-size="15" fill="#475569">+ mode fit + tool readiness</text>
    <text x="470" y="258" font-size="15" fill="#475569">+ learning prior + operator intent</text>
    <text x="470" y="284" font-size="15" fill="#475569">− safety and scope penalties</text>
    <rect x="872" y="132" width="456" height="248" rx="22" fill="#ffffff"/>
    <text x="900" y="168" font-size="19" fill="#172033" font-weight="900">Selected specialists</text>
    <text x="900" y="206" font-size="15" fill="#475569">API Security · Business Logic · Reverse Engineer</text>
    <text x="900" y="232" font-size="15" fill="#475569">Mobile Pentester · Cloud Security · CI/CD Red Team</text>
    <text x="900" y="258" font-size="15" fill="#475569">PoC Validator · Report Generator · Scope Guard</text>
    <text x="900" y="304" font-size="14" fill="#64748b">Router output is stored as artifacts and shown to the operator.</text>
  </g>
  <g stroke="#93e3c0" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#93e3c0"/></marker></defs>
    <path d="M352 256 L442 256"/>
    <path d="M782 256 L872 256"/>
  </g>
</svg>
