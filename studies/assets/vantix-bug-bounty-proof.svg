<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Vantix bug bounty proof</title>
  <desc id="desc">Marketing banner showing reports submitted through HackerOne, breadth, CVSS severity, and review-ready evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.48" stop-color="#eef7f4"/>
      <stop offset="1" stop-color="#fff7e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="430" rx="32" fill="url(#bg)"/>
  <circle cx="1025" cy="82" r="118" fill="#2563eb" opacity="0.09"/>
  <circle cx="1030" cy="350" r="170" fill="#16a36f" opacity="0.08"/>
  <circle cx="165" cy="354" r="150" fill="#f97316" opacity="0.08"/>

  <g transform="translate(68 58)">
    <rect x="0" y="0" width="154" height="34" rx="17" fill="#0f172a"/>
    <text x="18" y="23" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="800">PUBLIC PROOF</text>
    <text x="0" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" fill="#172033" font-weight="900">Bug bounty proof that survives review</text>
    <text x="0" y="134" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#475569">Findings submitted through HackerOne, duplicate-confirmed credibility, and 10 reports currently in review.</text>
  </g>

  <g transform="translate(68 220)" filter="url(#shadow)">
    <rect width="238" height="118" rx="22" fill="#ffffff" stroke="#d8e3e0"/>
    <text x="24" y="42" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" fill="#172033" font-weight="900">90</text>
    <text x="24" y="74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#2563eb" font-weight="800">bug bounty results</text>
    <text x="24" y="99" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">sanitized public inventory</text>
  </g>
  <g transform="translate(330 220)" filter="url(#shadow)">
    <rect width="238" height="118" rx="22" fill="#ffffff" stroke="#d8e3e0"/>
    <text x="24" y="42" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" fill="#172033" font-weight="900">10</text>
    <text x="24" y="74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#16a36f" font-weight="800">in HackerOne review</text>
    <text x="24" y="99" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">no payout claim made</text>
  </g>
  <g transform="translate(592 220)" filter="url(#shadow)">
    <rect width="238" height="118" rx="22" fill="#ffffff" stroke="#d8e3e0"/>
    <text x="24" y="42" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" fill="#172033" font-weight="900">Accepted</text>
    <text x="24" y="74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#7c3aed" font-weight="800">accepted + closed as dupe</text>
    <text x="24" y="99" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">credible bug class signal</text>
  </g>
  <g transform="translate(854 220)" filter="url(#shadow)">
    <rect width="278" height="118" rx="22" fill="#ffffff" stroke="#d8e3e0"/>
    <text x="24" y="42" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" fill="#172033" font-weight="900">5+ methods</text>
    <text x="24" y="74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#dc2626" font-weight="800">logic, source, mobile, protocol</text>
    <text x="24" y="99" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">breadth beyond scanner output</text>
  </g>

  <g transform="translate(70 368)">
    <rect width="188" height="32" rx="16" fill="#fee2e2"/>
    <text x="18" y="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#991b1b" font-weight="800">CVSS Critical patterns</text>
    <rect x="208" width="214" height="32" rx="16" fill="#dbeafe"/>
    <text x="226" y="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#1d4ed8" font-weight="800">proof-ready narratives</text>
    <rect x="442" width="204" height="32" rx="16" fill="#dcfce7"/>
    <text x="460" y="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#166534" font-weight="800">redacted safely</text>
  </g>
</svg>
