<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Vantix Mission Control UI model</title>
  <desc id="desc">Guided security workflow UI with mode cards, run cockpit, skill match, evidence, proof, and reports.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#112b37"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1400" height="520" rx="32" fill="#eaf5f1"/>
  <rect x="52" y="42" width="1296" height="436" rx="28" fill="url(#shell)" filter="url(#shadow)"/>
  <rect x="82" y="78" width="224" height="384" rx="20" fill="#08111f" stroke="#1e3a4a"/>
  <text x="110" y="118" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#ffffff" font-weight="900">Launch</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#cbd5e1">
    <rect x="108" y="144" width="164" height="34" rx="12" fill="#123e34" stroke="#16a36f"/>
    <text x="124" y="166">Pentest</text>
    <rect x="108" y="190" width="164" height="34" rx="12" fill="#13233a" stroke="#3b82f6"/>
    <text x="124" y="212">Bug Bounty</text>
    <rect x="108" y="236" width="164" height="34" rx="12" fill="#241b3c" stroke="#8b5cf6"/>
    <text x="124" y="258">Own Source</text>
    <rect x="108" y="282" width="164" height="34" rx="12" fill="#3d2a10" stroke="#f59e0b"/>
    <text x="124" y="304">Mobile / APK</text>
    <rect x="108" y="336" width="164" height="84" rx="14" fill="#0f2233" stroke="#334155"/>
    <text x="124" y="362">Scope</text>
    <text x="124" y="386">Authorization</text>
    <text x="124" y="410">Proof depth</text>
  </g>
  <rect x="336" y="78" width="472" height="384" rx="20" fill="url(#panel)"/>
  <text x="366" y="118" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#172033" font-weight="900">Run Cockpit</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="366" y="142" width="382" height="50" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="386" y="173" font-size="15" fill="#1e40af" font-weight="800">Phase timeline · live events · approvals</text>
    <rect x="366" y="210" width="382" height="86" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="386" y="242" font-size="15" fill="#166534" font-weight="800">Skill Match</text>
    <text x="386" y="268" font-size="13" fill="#475569">API security · reverse engineering · PoC validator</text>
    <rect x="366" y="314" width="382" height="86" rx="14" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="386" y="346" font-size="15" fill="#6b21a8" font-weight="800">HypothesisGraph</text>
    <text x="386" y="372" font-size="13" fill="#475569">open · investigating · refuted · confirmed</text>
  </g>
  <rect x="838" y="78" width="476" height="184" rx="20" fill="url(#panel)"/>
  <text x="868" y="118" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#172033" font-weight="900">Evidence Workbench</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
    <rect x="868" y="144" width="108" height="54" rx="13" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="888" y="176" fill="#3730a3" font-weight="800">Artifacts</text>
    <rect x="994" y="144" width="108" height="54" rx="13" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="1015" y="176" fill="#9a3412" font-weight="800">Replay</text>
    <rect x="1120" y="144" width="108" height="54" rx="13" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="1138" y="176" fill="#166534" font-weight="800">Proof</text>
    <rect x="1246" y="144" width="38" height="54" rx="13" fill="#f1f5f9" stroke="#cbd5e1"/>
  </g>
  <rect x="838" y="282" width="476" height="180" rx="20" fill="url(#panel)"/>
  <text x="868" y="322" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#172033" font-weight="900">Report Readiness</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">
    <text x="868" y="358">✓ scope evidence</text>
    <text x="868" y="386">✓ redaction manifest</text>
    <text x="868" y="414">✓ mode-specific report pack</text>
    <text x="1090" y="358">✓ proof pack</text>
    <text x="1090" y="386">✓ reviewer disposition</text>
    <text x="1090" y="414">✓ signed attestation</text>
  </g>
</svg>
