<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">SecHive.ai Juice Shop proof</title>
  <desc id="desc">Marketing banner showing full black-box and white-box OWASP Juice Shop benchmark proof.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#17364d"/>
      <stop offset="1" stop-color="#165a4a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.26"/>
    </filter>
  </defs>
  <rect width="1200" height="430" rx="32" fill="url(#bg)"/>
  <path d="M0 332 C190 275 290 420 462 340 C650 252 770 310 930 238 C1050 184 1130 180 1200 208 L1200 430 L0 430 Z" fill="#38bdf8" opacity="0.13"/>
  <path d="M760 50 L1110 50 Q1142 50 1142 82 L1142 334 Q1142 366 1110 366 L760 366 Q728 366 728 334 L728 82 Q728 50 760 50 Z" fill="#ffffff" opacity="0.08"/>

  <g transform="translate(68 58)">
    <rect width="178" height="34" rx="17" fill="#facc15"/>
    <text x="18" y="23" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#422006" font-weight="900">FULL BENCHMARK</text>
    <text x="0" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" fill="#ffffff" font-weight="900">OWASP Juice Shop proof</text>
    <text x="0" y="135" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#dbeafe">Unredacted black-box and white-box reports on a safe, reproducible target.</text>
  </g>

  <g transform="translate(72 214)" filter="url(#shadow)">
    <rect width="330" height="132" rx="24" fill="#ffffff"/>
    <text x="26" y="44" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" fill="#172033" font-weight="900">Black-box</text>
    <text x="26" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" fill="#2563eb" font-weight="900">32</text>
    <text x="102" y="70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#475569" font-weight="800">validated findings</text>
    <text x="102" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#dc2626" font-weight="800">4 critical / 19 high / 9 medium</text>
  </g>
  <g transform="translate(436 214)" filter="url(#shadow)">
    <rect width="330" height="132" rx="24" fill="#ffffff"/>
    <text x="26" y="44" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" fill="#172033" font-weight="900">White-box</text>
    <text x="26" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" fill="#16a36f" font-weight="900">23</text>
    <text x="102" y="70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#475569" font-weight="800">source candidates</text>
    <text x="102" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#7c3aed" font-weight="800">kept separate from runtime proof</text>
  </g>
  <g transform="translate(800 214)" filter="url(#shadow)">
    <rect width="330" height="132" rx="24" fill="#ffffff"/>
    <text x="26" y="44" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" fill="#172033" font-weight="900">Evidence model</text>
    <text x="26" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#475569" font-weight="800">routes, payloads, artifacts</text>
    <text x="26" y="104" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#475569" font-weight="800">source links, remediation</text>
  </g>

  <g transform="translate(72 372)">
    <rect width="168" height="32" rx="16" fill="#fee2e2"/>
    <text x="18" y="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#991b1b" font-weight="900">full payload proof</text>
    <rect x="188" width="192" height="32" rx="16" fill="#dbeafe"/>
    <text x="206" y="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#1d4ed8" font-weight="900">safe lab target</text>
    <rect x="400" width="230" height="32" rx="16" fill="#dcfce7"/>
    <text x="418" y="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#166534" font-weight="900">black-box + white-box</text>
  </g>
</svg>
