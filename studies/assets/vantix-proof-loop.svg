<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Vantix proof-first loop</title>
  <desc id="desc">Scope, recon, skills, hypotheses, validation, negative evidence, proof packs, and reports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eefdf6"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="360" rx="30" fill="url(#bg)"/>
  <text x="62" y="60" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" fill="#172033" font-weight="900">The proof-first execution loop</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800">
    <g transform="translate(18 112)"><rect width="170" height="78" rx="18" fill="#dbeafe" stroke="#3b82f6"/><text x="24" y="34" fill="#1e40af">Scope</text><text x="24" y="56" fill="#475569" font-weight="500">authorize</text></g>
    <g transform="translate(220 112)"><rect width="170" height="78" rx="18" fill="#dcfce7" stroke="#22c55e"/><text x="24" y="34" fill="#166534">Signals</text><text x="24" y="56" fill="#475569" font-weight="500">recon/source/mobile</text></g>
    <g transform="translate(422 112)"><rect width="170" height="78" rx="18" fill="#ede9fe" stroke="#8b5cf6"/><text x="24" y="34" fill="#6b21a8">Skills</text><text x="24" y="56" fill="#475569" font-weight="500">specialists</text></g>
    <g transform="translate(624 112)"><rect width="170" height="78" rx="18" fill="#fef3c7" stroke="#f59e0b"/><text x="24" y="34" fill="#92400e">Hypotheses</text><text x="24" y="56" fill="#475569" font-weight="500">score/branch</text></g>
    <g transform="translate(826 112)"><rect width="170" height="78" rx="18" fill="#fee2e2" stroke="#ef4444"/><text x="24" y="34" fill="#991b1b">Validate</text><text x="24" y="56" fill="#475569" font-weight="500">prove/refute</text></g>
    <g transform="translate(1028 112)"><rect width="170" height="78" rx="18" fill="#cffafe" stroke="#06b6d4"/><text x="24" y="34" fill="#155e75">Proof pack</text><text x="24" y="56" fill="#475569" font-weight="500">hash/replay</text></g>
    <g transform="translate(1230 112)"><rect width="170" height="78" rx="18" fill="#f1f5f9" stroke="#64748b"/><text x="20" y="34" fill="#334155">Report</text><text x="20" y="56" fill="#475569" font-weight="500">sign/export</text></g>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs>
    <path d="M188 151 L220 151"/><path d="M390 151 L422 151"/><path d="M592 151 L624 151"/><path d="M794 151 L826 151"/><path d="M996 151 L1028 151"/><path d="M1198 151 L1230 151"/>
    <path d="M914 192 C914 260 708 286 708 202"/>
    <path d="M708 202 C708 230 578 250 503 202"/>
    <path d="M1113 192 C1113 260 1278 250 1316 202"/>
  </g>
  <text x="640" y="278" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#475569">Refuted paths become negative evidence. Incomplete proof goes back to the graph. Reports loop back through reviewer disposition.</text>
</svg>
