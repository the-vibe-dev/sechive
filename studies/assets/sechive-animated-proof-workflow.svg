<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">SecHive.ai Animated Proof Workflow</title><desc id="desc">Animated workflow from recon to skill routing to hypothesis validation proof pack and report.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b2a"/><stop offset="1" stop-color="#12382d"/></linearGradient><style>.t{font:900 42px Inter,Segoe UI,Arial,sans-serif;fill:#fff;letter-spacing:-1px}.s{font:500 18px Inter,Segoe UI,Arial,sans-serif;fill:#b8c7d9}.box{fill:#ffffff;stroke:#bcd8d0;stroke-width:1.2}.h{font:900 20px Inter,Segoe UI,Arial,sans-serif;fill:#172033}.p{font:600 13px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}.arrow{stroke:#16a36f;stroke-width:5;stroke-linecap:round;stroke-dasharray:12 16;animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-56}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.025)}}.dot{fill:#16a36f;animation:move 7s linear infinite}@keyframes move{0%{offset-distance:0%}100%{offset-distance:100%}}</style><path id="flow" d="M170 272 H1010"/></defs>
<rect width="1200" height="520" rx="34" fill="url(#bg)"/>
<text x="72" y="82" class="t">Recon → Skill Routing → Proof</text><text x="72" y="116" class="s">Completed THM/CTF room proofs validate SecHive.ai’s loop-based execution model across web, infra, AD, crypto, and specialized tasks.</text>
<g transform="translate(58 190)">
  <g class="pulse"><rect class="box" x="0" y="0" width="185" height="160" rx="24"/><text class="h" x="24" y="44">1. Recon</text><text class="p" x="24" y="74">Collect surfaces,</text><text class="p" x="24" y="94">services, routes,</text><text class="p" x="24" y="114">identity clues.</text></g>
  <g class="pulse" style="animation-delay:.3s"><rect class="box" x="230" y="0" width="185" height="160" rx="24"/><text class="h" x="254" y="44">2. Skill Match</text><text class="p" x="254" y="74">Select specialist</text><text class="p" x="254" y="94">agents by evidence,</text><text class="p" x="254" y="114">not guesswork.</text></g>
  <g class="pulse" style="animation-delay:.6s"><rect class="box" x="460" y="0" width="185" height="160" rx="24"/><text class="h" x="484" y="44">3. Hypothesize</text><text class="p" x="484" y="74">Build testable</text><text class="p" x="484" y="94">attack paths and</text><text class="p" x="484" y="114">rank by impact.</text></g>
  <g class="pulse" style="animation-delay:.9s"><rect class="box" x="690" y="0" width="185" height="160" rx="24"/><text class="h" x="714" y="44">4. Validate</text><text class="p" x="714" y="74">Replay safely,</text><text class="p" x="714" y="94">capture proof,</text><text class="p" x="714" y="114">refute weak leads.</text></g>
  <g class="pulse" style="animation-delay:1.2s"><rect class="box" x="920" y="0" width="185" height="160" rx="24"/><text class="h" x="944" y="44">5. Report</text><text class="p" x="944" y="74">Generate signed</text><text class="p" x="944" y="94">proof packs and</text><text class="p" x="944" y="114">submission output.</text></g>
  <line class="arrow" x1="194" y1="80" x2="226" y2="80"/><line class="arrow" x1="424" y1="80" x2="456" y2="80"/><line class="arrow" x1="654" y1="80" x2="686" y2="80"/><line class="arrow" x1="884" y1="80" x2="916" y2="80"/>
</g>
<circle r="8" class="dot"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
<text x="72" y="450" class="s">Feedback loops: failed validation writes negative evidence; confirmed proof updates future skill routing and report readiness.</text>
</svg>
